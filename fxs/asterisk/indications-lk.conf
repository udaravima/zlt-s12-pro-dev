
; Sri Lanka call-progress tones, appended by slic-asterisk-setup (Asterisk
; ships no [lk] section). Source: ITU Operational Bulletin 781 annex,
; "Various tones used in national networks (E.180)", position 1 Feb 2003:
;   dial 425 continuous; ringing 425 0.4 on 0.2 off 0.4 on 2.0 off;
;   busy 425 0.75/0.75; congestion 425 0.25/0.25; call waiting 425 0.5/2.5
; dialrecall/stutter/record are not in the ITU table: generic patterns.
[lk]
description = Sri Lanka
ringcadence = 400,200,400,2000
dial = 425
busy = 425/750,0/750
ring = 425/400,0/200,425/400,0/2000
congestion = 425/250,0/250
callwaiting = 425/500,0/2500
dialrecall = !425/100,!0/100,!425/100,!0/100,!425/100,!0/100,425
record = 1400/500,0/15000
info = !950/330,!1400/330,!1800/330,0
stutter = !425/100,!0/100,!425/100,!0/100,!425/100,!0/100,425
