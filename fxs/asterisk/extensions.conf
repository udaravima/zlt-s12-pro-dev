; Dialplan for the ZLT S12 Pro home PBX.
;
; Numbering
;   100        the RJ11 phone (rings with caller ID; via the slicctl daemon)
;   2XX        SIP accounts for LAN devices (softphones, apps, agents);
;              201..203 by default, more with ACCOUNTS=... slic-asterisk-setup
;   600        echo test (hear yourself: checks both audio directions)
;   601        hello-world announcement (checks the far-to-phone direction)
;   800        hand the call to a LAN AudioSocket service (an app/AI agent);
;              address in AUDIOSOCKET_APP below
;
; How the RJ11 phone joins a call (docs 11-pbx-asterisk.md has the full story)
;   to the phone:   Dial(Local/ring@slic-in) -> the daemon rings with caller
;                   ID; when the handset lifts, the call is answered and its
;                   audio runs over AudioSocket to the daemon (127.0.0.1:4573).
;   from the phone: the daemon collects the dialled digits (software DTMF
;                   detector), then drops a call file that opens an
;                   AudioSocket channel to itself and runs [from-phone] with
;                   those digits.

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
SLIC_CTL=/var/run/slic.ctl        ; daemon command FIFO (group asterisk, 0620)
SLIC_CALL=/var/run/slic.call      ; "<uuid>_<phase>", written by the daemon
SLIC_STATE=/var/run/slic.state    ; "state=idle|dialtone|dialing|ringing|talk|busy"
SLIC_AUDIOSOCKET=127.0.0.1:4573   ; the daemon's AudioSocket listener
PHONE_RING_SECS=45
AUDIOSOCKET_APP=@APP@        ; host:port of your AudioSocket app (slic-asterisk-setup APP=...)

; ---------------------------------------------------------------- entry

[from-lan]                        ; calls from the SIP accounts
include => house

[from-phone]                      ; calls dialled on the RJ11 handset
include => house
exten => i,1,Playback(pbx-invalid)  ; dialled a number that doesn't exist
 same => n,Hangup()

; ---------------------------------------------------------------- numbers

[house]
include => house-local            ; your own numbers: extensions_local.conf

exten => 100,1,NoOp(ring the RJ11 phone)
 same => n,Dial(Local/ring@slic-in,${PHONE_RING_SECS})
 same => n,Gosub(sub-busy,s,1(${DIALSTATUS}))

exten => _2XX,1,Dial(PJSIP/${EXTEN},30,${IF($["${CHANNEL(channeltype)}" = "AudioSocket"]?r)})
 same => n,Gosub(sub-busy,s,1(${DIALSTATUS}))

exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

exten => 601,1,Answer()
 same => n,Wait(0.5)
 same => n,Playback(hello-world)
 same => n,Playback(goodbye)
 same => n,Hangup()

exten => 800,1,Answer()
 same => n,Set(UUID=${SHELL(cat /proc/sys/kernel/random/uuid):0:36})
 same => n,AudioSocket(${UUID},${AUDIOSOCKET_APP})
 same => n,Hangup()

; After a failed Dial: a SIP caller gets a busy signal; the RJ11 phone
; (an AudioSocket channel, which can't carry "busy" signalling) is simply
; hung up, and the daemon plays the busy tone to the handset itself.
[sub-busy]
exten => s,1,GotoIf($["${CHANNEL(channeltype)}" = "AudioSocket"]?out)
 same => n,GotoIf($["${ARG1}" = "BUSY"]?busy)
 same => n(out),Hangup()
 same => n(busy),Busy(5)

; ---------------------------------------------------------------- RJ11 phone

; The ;2 half of Local/ring@slic-in. Stays unanswered (the caller hears
; ringback) until the handset lifts, then answers and bridges to the daemon.
;
; Caller ID comes from the network, so it is whitelisted before it reaches
; the shell in System(): no quotes, $, `, ;, | or commas can survive FILTER,
; so the single-quoted echo argument can't be broken out of.
[slic-in]
exten => ring,1,GotoIf($["${FILE(${SLIC_STATE},0,10)}" != "state=idle"]?busy)
 same => n,Set(UUID=${SHELL(cat /proc/sys/kernel/random/uuid):0:36})
 same => n,Set(NUM=${FILTER(0-9*#+,${CALLERID(num)})})
 same => n,Set(NAME=${FILTER(A-Za-z0-9 ._-,${CALLERID(name)}):0:15})
 same => n,System(echo 'call ${UUID} ${PHONE_RING_SECS} ${IF($[${LEN(${NUM})}]?${NUM}:-)} ${NAME}' > ${SLIC_CTL})
 same => n,Ringing()
 ; Wait for the daemon to settle the call: answered, ended or busy. (Testing
 ; for those, not for "!= ringing", is deliberate: until the daemon reads the
 ; command, the file still holds the previous call's outcome.)
 same => n,WaitForCondition(#,#["#{FILE(${SLIC_CALL})}" = "${UUID}_answered" | "#{FILE(${SLIC_CALL})}" = "${UUID}_ended" | "#{FILE(${SLIC_CALL})}" = "${UUID}_busy"],${PHONE_RING_SECS},0.1)
 same => n,GotoIf($["${FILE(${SLIC_CALL})}" = "${UUID}_answered"]?answer)
 same => n,GotoIf($["${FILE(${SLIC_CALL})}" = "${UUID}_busy"]?busy)
 same => n,Hangup()
 same => n(answer),Answer()
 same => n,AudioSocket(${UUID},${SLIC_AUDIOSOCKET})
 same => n,Hangup()
 same => n(busy),Busy(5)

; the caller gave up (or Dial timed out) while it rang: stop the bell
; (GotoIf, not ExecIf: ExecIf needs app_exec, which isn't installed)
exten => h,1,GotoIf($[${LEN(${UUID})} = 0]?done)
 same => n,System(echo 'hangup ${UUID}' > ${SLIC_CTL})
 same => n(done),NoOp()

; ---------------------------------------------------------------- yours

; Numbers you add go in /etc/asterisk/extensions_local.conf, under
; [house-local] (reachable from the handset and every SIP account).
; slic-asterisk-setup never creates or overwrites that file.
[house-local]
#tryinclude extensions_local.conf
