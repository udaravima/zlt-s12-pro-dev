; PJSIP for the ZLT S12 Pro home PBX: SIP on the LAN only.
;
; Who can talk to it: devices on the LAN (softphones, apps, AI agents) that
; register as 201..203. Nothing on the WAN: the transport binds the LAN
; address only, the ACL below admits only the LAN and loopback, and the
; firewall's wan zone rejects input anyway (three independent locks).
;
; The RJ11 phone is NOT a SIP endpoint. It is reached through the
; slicctl daemon over AudioSocket (see extensions.conf, contexts slic-*).
;
; Installed by slic-asterisk-setup, which fills in @LAN_IP@ / @LAN_NET@ /
; @LAN_MASK@ from the router's lan zone. Passwords live in
; pjsip_secrets.conf, generated on the router by the same script and never
; committed.

[global]
type=global
user_agent=zlt-pbx
; identify by SIP username first; nobody is identified by IP alone
endpoint_identifier_order=username

; type=acl applies to every incoming SIP request (res_pjsip_acl);
; an endpoint's own acl= option would name acl.conf entries instead.
[lan-only]
type=acl
deny=0.0.0.0/0.0.0.0
permit=@LAN_NET@/@LAN_MASK@
permit=127.0.0.1/255.255.255.255

[transport-lan-udp]
type=transport
protocol=udp
bind=@LAN_IP@:5060

[transport-lan-tcp]
type=transport
protocol=tcp
bind=@LAN_IP@:5060

; ---- templates ----

[lan-endpoint](!)
type=endpoint
context=from-lan
disallow=all
; g722 = wideband between softphones; ulaw/alaw for everything else.
; The RJ11 phone is 8 kHz linear; Asterisk transcodes at the AudioSocket edge.
allow=g722,ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
language=en

[lan-aor](!)
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=60

; ---- accounts (username = extension; password in pjsip_secrets.conf) ----

[201](lan-endpoint)
auth=201-auth
aors=201
callerid="Ext 201" <201>
[201](lan-aor)

[202](lan-endpoint)
auth=202-auth
aors=202
callerid="Ext 202" <202>
[202](lan-aor)

[203](lan-endpoint)
auth=203-auth
aors=203
callerid="Ext 203" <203>
[203](lan-aor)

; [201-auth] [202-auth] [203-auth] (type=auth) come from here:
#tryinclude pjsip_secrets.conf
